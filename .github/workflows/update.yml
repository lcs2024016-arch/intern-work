name: Update internships

on:
  schedule:
    # Hourly, on the hour UTC.
    #
    # Discover is NOT run here on purpose: it is the slow, network-heavy half
    # (40+ min of probing) and it appends to the registry. Interleaving it would
    # make every hourly run a 45-minute run and repeatedly re-probe the same
    # companies. discover.yml keeps its own daily schedule and commits the
    # registry; this workflow just picks those companies up on its next run.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-internships
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip list

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Run the engine
        # WORKDAY_PROXY is an optional repository secret. Workday blocks
        # datacentre IPs far more than residential ones, so routing through a
        # proxy materially raises the hit rate on the 1,589 Workday tenants —
        # which is most of the registry. The engine falls back to direct
        # connections when it is unset.
        env:
          WORKDAY_PROXY: ${{ secrets.WORKDAY_PROXY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run.py update

      - name: Commit & push if changed
        run: |
          git config user.name  "10vulture1005"
          git config user.email "10vulture1005@users.noreply.github.com"
          for f in \
            README.md \
            data/jobs.json data/internships.csv data/stats.json \
            data/health.json data/history.jsonl data/compensation_cache.json \
            docs/index.html docs/feed.xml \
            docs/trends-light.svg docs/trends-dark.svg \
            docs/api/jobs.json docs/api/stats.json docs/api/companies.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update internships ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push race, retrying ($attempt)…"; sleep 5
            done
          fi